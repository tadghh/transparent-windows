cargo-features = ["panic-immediate-abort"]

[package]
authors    =["Ethan Henry"]
description="Set the transparency of windows, for Windows!"
edition    ="2024"
keywords   =["transparency", "windows"]
name       ="win_alpha"
readme     ="readme.md"
repository ="https://github.com/tadghh/transparent-windows"
version    ="1.2.10"

[[bin]]
name="win_alpha"
path="src/main.rs"

[target.'cfg(windows)'.dependencies]
tray-item="0.10.0"
windows={ version="0.59.0", default-features=false, features=[
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
tray-item={ version="0.10.0", features=["ksni"] }
x11rb="0.13"
zbus="4"

[package.metadata]
os=["windows", "linux"]

[lints.rustdoc]
bare_urls               ="warn"
broken_intra_doc_links  ="deny"
invalid_rust_codeblocks ="warn"
private_intra_doc_links ="warn"
redundant_explicit_links="warn"
unescaped_backticks     ="warn"

[profile.release]
codegen-units  =1
debug          =false
incremental    =false
lto            ="fat"
opt-level      ="z"
overflow-checks=false
panic          ="immediate-abort"
rpath          =false
strip          ="symbols"

[build-dependencies]
embed-resource="2.5"
slint-build   ="1.10.0"

# Linux tray icons are embedded ARGB pixmaps (no `.rc` resource like Windows), so
# the PNG is decoded at build time. See `build.rs`.
[target.'cfg(unix)'.build-dependencies]
image={ version="0.25", default-features=false, features=["png"] }

[dependencies]
anyhow           ="1.0.97"
directories      ="5.0.1"

serde={ version="1.0.219", default-features=false, features=["derive"] }
serde_json={ version="1.0.140", default-features=false, features=["std"] }
slint={ version="1.10.0", default-features=false, features=[
  "backend-winit",
  "compat-1-2",
  "renderer-software",
  "std",
] }
tokio={ version="1.44.2", default-features=false, features=[
  "macros",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
